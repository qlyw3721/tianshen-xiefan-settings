  <text x="120" y="1292" font-size="11" fill="#4a3728">★＝都城／圣所　●＝主要城市／地点　☩＝教廷总部　- - -＝政权界线　┄┄＝跨洋航线　◆＝物产／产区／栖息地／地标（v1.53 三处 · v1.55 五处 · v1.58 两处 · v1.60 四处 · v1.62 三处，共十七处）</text>
  <text x="60" y="1320" font-size="12.5" fill="#4a3728">原著方位为骨：卡妙＝极北、神圣帝国＝东北、金雀花＝大陆中央、泰坦＝最南端、奥古迦＝西部、缪斯大陆在史诗大陆以北接壤（均出前后传原文，行号见设定集 §1.10）。</text>
  <text x="60" y="1344" font-size="12.5" fill="#4a3728">现实原型为参照：卡妙帝国＝俄罗斯帝国（用户裁定）；金雀花＝拜占庭、神圣帝国＝神圣罗马、泰坦＝普鲁士—德意志、奥古迦＝查理曼、白蔷薇＝波旁法兰西、缪斯＝草原—西伯利亚等均为【续补·原创参照】，详见设定集 §1.2.5。</text>
  <text x="60" y="1368" font-size="12" fill="#8a6d3b">本图为示意轮廓：各政权相对形状、界线不等同精确疆域；海域定位（琴瑟海等）原著未指明处依 v1.34 经纬度与地形反推规则原创定位。前后传原文 txt 一字不改。</text>
  <text x="60" y="1392" font-size="11.5" fill="#8a6d3b">◆ 阿萨利＝卡妙南境界河冷水系　摩尔苏＝奥古迦故地北缘冷凉河谷　杰安帝＝南部暖丘陵（均【续补·原创定位】，反推依据见设定集 §1.9）。</text>
  <text x="60" y="1412" font-size="11" fill="#8a6d3b">◆ v1.55 五处：威灵顿（白酒）· 玛索亚（下午茶）· 波坎儿（奶茶）· 笛卡尔暗河（三眼蝰蛇）· 南部苇荡（毒箭巨蛙）；皆【续补·原创定位】，见 §1.9／§1.8。</text>
  <text x="60" y="1432" font-size="11" fill="#8a6d3b">◆ v1.58 两处：德古拉之牙（奥格斯歌城亲王府·占星楼，原文定位）· 南极墨菲神殿（史诗大陆最南端极南冰缘【续补·原创定位】）；见 §1.4.2／§1.10。</text>
  <text x="60" y="1452" font-size="11" fill="#8a6d3b">◆ v1.60 四处：黄昏盆地（帝国南部南疆，前传 L327）· 翡翠河（盆地内渡口【续补·原创定位】）· 罗伽费因格竞技场／帝国学院（帝都朱庇特城，原文定位）；见 §1.4.3／§1.5.7／§9.3 子词条 9。</text>
  <text x="60" y="1472" font-size="11" fill="#8a6d3b">◆ v1.62 三处：瑕多丽庄园（奥格斯歌城近郊采邑 · 血鳞石，前传 L575）· 塞缪耳森林（帝国东南玛敦郡 · 异教徒根据地，前传 L609）· 茴香卑斯山脉（帝国中部 · 纯种马产地，后传 L211 原文定位）；前两处【续补·原创定位】，见 §1.5.8／§1.5.9／§8.5。另「◆ 波坎儿」标注点补入红酒（§1.9 v1.62 新增行），不另增点。</text>
